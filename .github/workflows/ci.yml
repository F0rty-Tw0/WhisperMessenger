name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run StyLua
        run: npx --yes @johnnymorganz/stylua-bin@2.5.2 --check .

      - name: Run Luacheck
        uses: lunarmodules/luacheck@v1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run release script tests
        run: python -m unittest tests.scripts.test_gen_patch_notes tests.scripts.test_promote_changelog

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1

      - name: Run tests
        run: |
          set -euo pipefail
          while IFS= read -r -d '' test_file; do
            lua5.1 tests/run.lua "${test_file}"
          done < <(find tests -type f -name 'test_*.lua' -print0 | sort -z)
