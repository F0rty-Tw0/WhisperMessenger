name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run StyLua
        run: npx --yes @johnnymorganz/stylua-bin@2.4.0 --check .

      - name: Run Luacheck
        uses: lunarmodules/luacheck@v1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1

      - name: Run tests
        run: |
          for f in tests/**/*.lua; do
            lua5.1 tests/run.lua "$f"
          done
